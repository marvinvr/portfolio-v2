name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # $env/static imports need these to exist at build time; values are not used.
      PUBLIC_ENVIRONMENT: ci
      PUBLIC_CF_ANALYTICS_ID: ""
      YOUTUBE_API_KEY: ""
      WHOOP_CLIENT_ID: ""
      WHOOP_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build
